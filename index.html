<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hanafi Book Network</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap');

  :root{
    --parchment:#f3ead9;
    --parchment-deep:#e9dcc2;
    --ink:#2b2320;
    --maroon:#7a2e2e;
    --gold:#a6763f;
    --line:#8a7355;
  }

  *{box-sizing:border-box;}

  html,body{margin:0;padding:0;}

  body{
    min-height:100vh;
    background:var(--parchment);
    font-family:'Cairo', sans-serif;
    color:var(--ink);
  }

  #toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    padding:14px 18px;
    background:var(--parchment-deep);
    border-bottom:1.5px solid var(--line);
    position:sticky;
    top:0;
    z-index:20;
  }

  #toolbar input[type=text]{
    font-family:'Amiri', serif;
    font-size:15px;
    padding:8px 12px;
    border:1.5px solid var(--line);
    border-radius:5px;
    background:#fffaf0;
    color:var(--ink);
    min-width:220px;
  }

  button{
    font-family:'Cairo', sans-serif;
    font-size:13.5px;
    font-weight:600;
    padding:8px 14px;
    border-radius:5px;
    border:1.5px solid var(--maroon);
    background:var(--maroon);
    color:#fff8ee;
    cursor:pointer;
  }
  button.secondary{
    background:transparent;
    color:var(--maroon);
  }
  button:hover{opacity:0.88;}

  .legend{
    display:flex;
    gap:18px;
    margin-inline-start:auto;
    font-size:12.5px;
    color:#6b5d4f;
    align-items:center;
  }
  .legend-item{display:flex;align-items:center;gap:6px;}
  .swatch{width:28px;height:0;border-top-width:3px;border-top-style:solid;}

  #hint{
    padding:8px 18px;
    font-size:13px;
    color:#6b5d4f;
    background:#fffaf0;
    border-bottom:1px solid var(--line);
    min-height:18px;
  }

  #canvas-wrap{
    position:relative;
    width:100%;
    height:calc(100vh - 108px);
    overflow:auto;
  }

  #zoom-sizer{
    position:relative;
  }

  #canvas{
    position:relative;
    width:7450px;
    height:7050px;
    transform-origin:0 0;
    background-image:
      radial-gradient(circle at 20% 15%, rgba(166,118,63,0.06), transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(122,46,46,0.05), transparent 45%);
  }

  svg#lines{
    position:absolute;
    top:0; left:0;
    width:7450px;
    height:7050px;
    pointer-events:none;
  }

  #centuryBg{
    position:absolute;
    top:0; left:0;
    width:7450px;
    height:7050px;
    pointer-events:none;
    z-index:0;
  }
  .century-band{
    position:absolute;
    left:0;
    width:100%;
  }
  #timeline{
    position:absolute;
    top:0; left:0;
    width:7450px;
    height:7050px;
    pointer-events:none;
    z-index:1;
  }
  .century-row{
    position:absolute;
    left:0;
    width:100%;
    border-top:1.5px dashed rgba(138,115,85,0.4);
  }
  .century-label{
    position:absolute;
    left:20px;
    font-family:'Amiri', serif;
    font-weight:700;
    font-size:21px;
    color:var(--gold);
    background:rgba(243,234,217,0.95);
    padding:12px 20px;
    border:2px solid rgba(138,115,85,0.45);

    white-space:nowrap;

    box-shadow:0 2px 8px rgba(43,35,32,0.10);

  .century-label .en{
    display:block;
    font-family:'Cairo', sans-serif;
    font-weight:600;
    font-style:italic;
    font-size:14px;
    color:#6b5d4f;
    margin-top:2px;
  }

  .node{
    position:absolute;
    font-family:'Amiri', serif;
    font-weight:700;
    font-size:16px;
    background:linear-gradient(180deg,#fffaf0,var(--parchment-deep));

  .node.viewed{

  .node.combine{

    height:22px;

    border-radius:50%;

    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:700;

    background:#fffaf0;
    border:1.5px solid #8a7355;
  }
  .node.manuscript{
    border-color:#a31d1d;
    background:linear-gradient(180deg,#fff1ef,#fad4d0);
    box-shadow:0 0 0 2px rgba(163,29,29,0.22);

  .node .ms-toggle{
    position:absolute;
    top:-9px; left:-9px;
    width:20px; height:20px;
    border-radius:50%;
    background:#fffaf0;
    border:1.5px solid #a31d1d;
    color:#a31d1d;
    font-size:10px;
    font-weight:700;
    line-height:17px;
    text-align:center;

  .node.manuscript .ms-toggle{display:block;background:#a31d1d;color:#fff8ee;}

  .node .color-toggle{
    position:absolute;
    bottom:-9px; left:-9px;
    width:18px; height:18px;
    border-radius:50%;
    border:1.5px solid #fff8ee;
    box-shadow:0 0 0 1px var(--line);

  .node:hover .color-toggle{display:block;}

  .node .color-text-toggle{
    position:absolute;
    bottom:-9px; right:-9px;
    width:20px; height:20px;
    border-radius:50%;
    background:#fffaf0;

    border-radius:50%;

    line-height:18px;

  }
  .node:hover .del{display:block;}

    background:#fffaf0;
    border:1.5px solid var(--line);

    right:20px;

    overflow-y:auto;

  .popup{
    background:#fffaf0;
    border:1.5px solid var(--line);
    border-radius:8px;
    box-shadow:0 6px 18px rgba(43,35,32,0.25);
    padding:14px 16px;
    position:relative;
  }
  .popup-close{
    position:absolute;
    top:8px; right:8px;
    width:22px; height:22px;
    padding:0;
    border-radius:50%;
    background:transparent;

    border:1px solid var(--line);
    font-size:13px;
    line-height:1;

  .popup h3{
    margin:0 26px 10px 0;

    font-size:17px;

  .popup-subtitle{

    font-family:'Cairo', sans-serif;

  .popup-save{

  .popup-status{
    margin-top:6px;
    font-size:11.5px;
    color:#6b5d4f;

  .popup-delete{
    display:block;
    margin-top:14px;

    font-size:12.5px;
    padding:6px 12px;
    background:transparent;
    color:var(--maroon);
    border:1.5px solid var(--maroon);

  .popup-conn-header{
    margin-top:12px;
    font-size:12px;
    font-weight:700;
    color:#6b5d4f;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .popup-conn-list{
    margin-top:6px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .popup-conn-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    font-size:12.5px;
    padding:4px 6px;
    background:var(--parchment-deep);

  .popup-conn-remove{

    padding:0;

    display:flex;

  .popup-conn-add select{
    font-family:'Cairo', sans-serif;
    font-size:12.5px;

    border:1.5px solid var(--line);

    background:#fffaf0;

  .popup-conn-direction{
    font-size:12px;
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--line);
    padding:5px 8px;
    text-align:center;

<body>

  <div id="toolbar">
    <div style="display:flex;align-items:center;gap:6px;position:relative;">
      <input type="text" id="bookSearch" placeholder="🔍 اسم الكتاب / Search books" autocomplete="off" oninput="onSearchInput()" onkeydown="onSearchKeydown(event)">
      <div id="searchResults" class="search-results"></div>
    </div>

    <div class="viewer-only">
      <button class="secondary" onclick="enterAdminMode()">🔓 Enter edit mode</button>
    </div>

    <div class="admin-only" style="display:flex;align-items:center;gap:10px;">
      <input type="text" id="bookName" placeholder="اسم الكتاب / Book name" onkeydown="if(event.key==='Enter')addBook()">
      <button onclick="addBook()">+ Add book</button>
      <button id="combineBtn" class="secondary" onclick="toggleCombineMode()">⊕ Combine books</button>
      <button id="connectBtn" class="secondary" onclick="toggleConnectMode()">🔗 Connect mode</button>
      <button class="secondary" onclick="clearSelection()">Cancel selection</button>
      <button class="secondary" onclick="resetAll()">Reset board</button>
    </div>

    <div style="display:flex;align-items:center;gap:6px;margin-inline-start:12px;">
      <button class="secondary" onclick="zoomOut()">−</button>
      <span id="zoomLabel" style="font-size:13px;min-width:42px;text-align:center;">100%</span>
      <button class="secondary" onclick="zoomIn()">+</button>
      <button class="secondary" onclick="zoomReset()">Reset zoom</button>
    </div>

    <div class="legend">
      <div class="legend-item">➤➤➤ Commentary — arrows</div>
      <div class="legend-item"><span class="swatch" style="border-top-color:#8a7355;border-top-style:dashed;"></span> Footnote — dashed</div>
      <div class="legend-item"><span class="swatch" style="border-top-color:#8a7355;border-top-style:dotted;border-top-width:4px;"></span> Summary — dotted</div>
      <div class="legend-item">✦✦✦ Combined into</div>
      <div class="legend-item"><span style="width:14px;height:14px;border-radius:50%;background:#a31d1d;display:inline-block;"></span> Manuscript (مخطوط)</div>
      <div class="legend-item" style="font-style:italic;">Line color = the book it comes from</div>
    </div>

    <div class="admin-only" style="display:flex;align-items:center;gap:8px;">
      <button class="secondary" onclick="setGithubToken()">🔑 GitHub token</button>
      <button class="secondary" onclick="exportState()">⭳ Export</button>
      <button class="secondary" onclick="exitAdminMode()">Exit edit mode</button>
    </div>
  </div>

  <div id="hint">Click a book to see notes about it and its author, and to highlight its connections. Ctrl/Cmd + scroll to zoom, drag to pan.</div>

  <div id="canvas-wrap">
    <div id="zoom-sizer">
      <div id="canvas">
        <div id="centuryBg"></div>
        <div id="timeline"></div>
        <svg id="lines"></svg>
      </div>
    </div>
  </div>

  <div id="notesPopups"></div>

  <div id="menu">
    <button onclick="makeEdge('commentary')">Commentary — bold line</button>
    <button onclick="makeEdge('footnote')">Footnote — dashed line</button>
    <button onclick="makeEdge('summary')">Summary — dotted line</button>
    <button onclick="hideMenu()">Cancel</button>
  </div>

<script>
// Fallback so this board also persists when opened outside Claude (e.g. GitHub Pages),
// where window.storage isn't provided. Uses localStorage instead, scoped per-browser.
if (!window.storage) {
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem('hanafi-book-network:' + key);
      if (raw === null) return null;
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      localStorage.setItem('hanafi-book-network:' + key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem('hanafi-book-network:' + key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage)
        .filter(k => k.startsWith('hanafi-book-network:' + (prefix || '')))
        .map(k => k.replace('hanafi-book-network:', ''));
      return { keys, shared: false };
    }
  };
}

let state = { nodes: [], edges: [] };
let selected = null;
let pendingPair = null;
let dragInfo = null;
let combineMode = false;
let combineSet = new Set();
let connectMode = false;
let viewedNode = null;
let connAddState = { targetId: '', type: 'commentary', reversed: false };
let zoom = 1;
const ZOOM_MIN = 0.3, ZOOM_MAX = 2.5, ZOOM_STEP = 0.1;
const STORAGE_KEY = 'hanafi-book-network';

// Security-through-obscurity only: this key is visible to anyone who views the page
// source. It just keeps casual visitors from stumbling into edit mode.
const ADMIN_KEY = 'hanafibooks';
const ADMIN_FLAG_KEY = 'hanafi-book-network:isAdmin';
let isAdmin = false;

function initAdminMode(){
  try{
    const params = new URLSearchParams(window.location.search);
    const editParam = params.get('edit');
    if(editParam && editParam === ADMIN_KEY){
      localStorage.setItem(ADMIN_FLAG_KEY, '1');
      history.replaceState(null, '', window.location.pathname + window.location.hash);
    }
    isAdmin = localStorage.getItem(ADMIN_FLAG_KEY) === '1';
  }catch(e){ isAdmin = false; }
  document.body.classList.toggle('admin', isAdmin);
}

const GH_TOKEN_KEY = 'hanafi-book-network:ghToken';
const GH_REPO = 'ARK120701/hanafi-book-network';
const GH_NOTES_PATH = 'notes.json';
let publishStatus = {}; // transient, not persisted: { 'nodeId:field': 'status message' }

function b64EncodeUtf8(str){
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  for(let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

function b64DecodeUtf8(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function setGithubToken(){
  if(!isAdmin) return;
  const hasToken = !!localStorage.getItem(GH_TOKEN_KEY);
  const val = prompt(
    (hasToken ? 'A GitHub token is already saved in this browser.\n' : '') +
    'Paste a GitHub personal access token (fine-grained, scoped to just this repo, with "Contents: Read and write" permission) to enable auto-publishing notes.\nLeave blank and submit to remove the saved token.'
  );
  if(val === null) return;
  const trimmed = val.trim();
  if(!trimmed){
    localStorage.removeItem(GH_TOKEN_KEY);
    alert('GitHub token removed from this browser.');
    return;
  }
  localStorage.setItem(GH_TOKEN_KEY, trimmed);
  alert('GitHub token saved in this browser. Notes you save will now publish automatically.');
}

async function publishNoteField(nodeId, field, value){
  const token = localStorage.getItem(GH_TOKEN_KEY);
  if(!token) return { ok:false, message:'No GitHub token set.' };
  try{
    const apiUrl = `https://api.github.com/repos/${GH_REPO}/contents/${GH_NOTES_PATH}`;
    const getRes = await fetch(apiUrl, { headers: { 'Authorization':'token ' + token, 'Accept':'application/vnd.github+json' } });
    let sha, notesData = {};
    if(getRes.ok){
      const getJson = await getRes.json();
      sha = getJson.sha;
      notesData = JSON.parse(b64DecodeUtf8(getJson.content.replace(/\n/g, '')));
    } else if(getRes.status !== 404){
      throw new Error('Could not read notes.json (HTTP ' + getRes.status + ')');
    }

    if(!notesData[nodeId]) notesData[nodeId] = {};
    notesData[nodeId][field] = value;

    const putRes = await fetch(apiUrl, {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + token,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: 'Update notes for ' + nodeId + ' (' + field + ')',
        content: b64EncodeUtf8(JSON.stringify(notesData, null, 2)),
        sha
      })
    });

    if(!putRes.ok){
      const errJson = await putRes.json().catch(() => ({}));
      throw new Error(errJson.message || ('GitHub API error ' + putRes.status));
    }

    return { ok:true, message:'Published — live for everyone within about a minute.' };
  }catch(e){
    return { ok:false, message:'Failed to publish: ' + e.message };
  }
}

async function saveAndPublishNote(nodeId, field, value){
  const node = state.nodes.find(n => n.id === nodeId);
  if(!node) return;
  node[field] = value;
  saveState();
  const key = nodeId + ':' + field;
  const hasToken = !!localStorage.getItem(GH_TOKEN_KEY);
  publishStatus[key] = hasToken ? 'Publishing…' : 'Saved in this browser only — set a GitHub token (toolbar) to publish it for everyone.';
  render();
  if(!hasToken) return;
  const result = await publishNoteField(nodeId, field, value);
  publishStatus[key] = result.message;
  render();
}

async function loadPublishedNotes(){
  try{
    const res = await fetch('notes.json', { cache: 'no-store' });
    if(!res.ok) return;
    const data = await res.json();
    let changed = false;
    Object.keys(data).forEach(id => {
      const n = state.nodes.find(x => x.id === id);
      if(!n) return;
      if(typeof data[id].bookNotes === 'string'){ n.bookNotes = data[id].bookNotes; changed = true; }
      if(typeof data[id].authorNotes === 'string'){ n.authorNotes = data[id].authorNotes; changed = true; }
    });
    if(changed) render();
  }catch(e){ /* offline, or notes.json not reachable (e.g. running from a plain file://) — ignore */ }
}

function enterAdminMode(){
  const val = prompt('Enter edit key:');
  if(val === null) return;
  if(val.trim() !== ADMIN_KEY) return;
  localStorage.setItem(ADMIN_FLAG_KEY, '1');
  isAdmin = true;
  document.body.classList.add('admin');
  render();
}

function exitAdminMode(){
  localStorage.removeItem(ADMIN_FLAG_KEY);
  isAdmin = false;
  document.body.classList.remove('admin');
  connectMode = false;
  combineMode = false;
  combineSet.clear();
  selected = null;
  pendingPair = null;
  viewedNode = null;
  hideMenu();
  render();
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY);
    if(res && res.value){
      state = JSON.parse(res.value);
    }
  }catch(e){ /* no saved state yet */ }

  if(!state.nodes || state.nodes.length === 0){
    seedDefaultState();
  }
  ensureExtraContent();
  render();
}

function nodeExists(id){
  return state.nodes.some(n => n.id === id);
}

// Reorders and spaces connected books within each century row (books with no connections,
// already parked in their own grid above, are left alone) so commentary/footnote/summary
// lines route around book boxes instead of through them. Century row placement itself is
// left untouched — it comes from each node's existing y, established by the hand-placed
// positions and fixups above.
function computeLayoutV1(){
  const LEFT_MARGIN = 280;
  const COL_GAP = 50;

  function estimateWidth(n){
    if(n.type === 'combine') return 22;
    const lines = n.name.split('\n');
    const maxLen = Math.max(...lines.map(l => l.length));
    return Math.max(90, Math.round(maxLen * 13) + 50);
  }

  const rowOf = n => Math.max(0, Math.min(NUM_CENTURIES - 1, Math.round((n.y - CENTURY_START_Y) / CENTURY_HEIGHT)));

  const realBooks = state.nodes.filter(n => n.type !== 'combine');
  const combineNodes = state.nodes.filter(n => n.type === 'combine');

  // A book counts as "connected" if it has a non-merge edge, or is a source/result of a combine.
  const connectedIds = new Set();
  state.edges.forEach(e => {
    if(e.type === 'merge') return;
    connectedIds.add(e.from);
    connectedIds.add(e.to);
  });
  combineNodes.forEach(plus => {
    state.edges.filter(e => e.type === 'merge' && e.to === plus.id).forEach(e => connectedIds.add(e.from));
    const resultEdge = state.edges.find(e => e.type === 'merge' && e.from === plus.id);
    if(resultEdge) connectedIds.add(resultEdge.to);
  });

  // Logical adjacency for ordering: direct edges between real books, plus source<->result
  // pairs bridged through each combine "+" marker (so merged books pull toward each other).
  const neighbors = {};
  realBooks.forEach(n => { neighbors[n.id] = []; });
  state.edges.forEach(e => {
    if(e.type === 'merge') return;
    const a = state.nodes.find(n => n.id === e.from);
    const b = state.nodes.find(n => n.id === e.to);
    if(!a || !b || a.type === 'combine' || b.type === 'combine') return;
    neighbors[a.id].push(b);
    neighbors[b.id].push(a);
  });
  combineNodes.forEach(plus => {
    const sources = state.edges.filter(e => e.type === 'merge' && e.to === plus.id)
      .map(e => state.nodes.find(n => n.id === e.from)).filter(Boolean);
    const resultEdge = state.edges.find(e => e.type === 'merge' && e.from === plus.id);
    const result = resultEdge ? state.nodes.find(n => n.id === resultEdge.to) : null;
    if(!result) return;
    sources.forEach(s => {
      neighbors[s.id].push(result);
      neighbors[result.id].push(s);
    });
  });

  const rows = {};
  for(let r = 0; r < NUM_CENTURIES; r++) rows[r] = [];
  realBooks.filter(n => connectedIds.has(n.id)).forEach(n => rows[rowOf(n)].push(n));
  Object.values(rows).forEach(list => list.sort((a, b) => a.x - b.x));

  function layoutRow(list){
    let x = LEFT_MARGIN;
    list.forEach(n => { n.x = x; x += estimateWidth(n) + COL_GAP; });
  }
  Object.values(rows).forEach(layoutRow);

  // Barycenter sweeps: pull each book toward the average x of what it's connected to,
  // re-spacing its row each pass, so related books drift into aligned columns.
  for(let pass = 0; pass < 5; pass++){
    for(let r = 0; r < NUM_CENTURIES; r++){
      const list = rows[r];
      if(list.length < 2) continue;
      const keyed = list.map(n => {
        const ns = neighbors[n.id];
        const avg = ns.length ? ns.reduce((s, o) => s + o.x, 0) / ns.length : n.x;
        return { n, avg };
      });
      keyed.sort((p, q) => p.avg - q.avg || p.n.id.localeCompare(q.n.id));
      rows[r] = keyed.map(k => k.n);
      layoutRow(rows[r]);
    }
  }

  // Combine "+" markers follow their (now repositioned) source books.
  combineNodes.forEach(plus => {
    const sources = state.edges.filter(e => e.type === 'merge' && e.to === plus.id)
      .map(e => state.nodes.find(n => n.id === e.from)).filter(Boolean);
    if(sources.length === 0) return;
    const resultEdge = state.edges.find(e => e.type === 'merge' && e.from === plus.id);
    const result = resultEdge ? state.nodes.find(n => n.id === resultEdge.to) : null;
    const avgX = sources.reduce((s, n) => s + n.x, 0) / sources.length;
    const maxY = Math.max(...sources.map(n => n.y));
    plus.x = avgX - 6;
    plus.y = result ? (maxY + result.y) / 2 - 8 : maxY + 90;
  });
}

function nextColor(){
  if(state._colorIndex === undefined) state._colorIndex = 0;
  const c = COLOR_PALETTE[state._colorIndex % COLOR_PALETTE.length];
  state._colorIndex++;
  return c;
}

function applyZoom(){
  const canvas = document.getElementById('canvas');
  const sizer = document.getElementById('zoom-sizer');
  canvas.style.transform = `scale(${zoom})`;
  sizer.style.width = (7450 * zoom) + 'px';
  sizer.style.height = (7050 * zoom) + 'px';
  document.getElementById('zoomLabel').textContent = Math.round(zoom * 100) + '%';
}

function zoomIn(){
  zoom = Math.min(ZOOM_MAX, +(zoom + ZOOM_STEP).toFixed(2));
  applyZoom();
}

function zoomOut(){
  zoom = Math.max(ZOOM_MIN, +(zoom - ZOOM_STEP).toFixed(2));
  applyZoom();
}

function zoomReset(){
  zoom = 1;
  applyZoom();
}

function toggleCombineMode(){
  if(!isAdmin) return;

  if(!combineMode){
    combineMode = true;
    connectMode = false;
    combineSet.clear();
    selected = null;
    pendingPair = null;
    hideMenu();
    render();
    return;
  }

  combineMode = false;
  if(combineSet.size >= 2){
    finishCombine();
  } else {
    combineSet.clear();
    render();
  }
}

function toggleConnectMode(){
  if(!isAdmin) return;
  connectMode = !connectMode;
  if(connectMode){
    combineMode = false;
    combineSet.clear();
  }
  selected = null;
  pendingPair = null;
  hideMenu();
  render();
}

function finishCombine(){
  if(!isAdmin) return;
  const ids = Array.from(combineSet);
  const sources = ids.map(id => state.nodes.find(n => n.id === id)).filter(Boolean);
  if(sources.length < 2) return;

  const name = prompt('What is the new book formed by combining these ' + sources.length + ' books?');
  if(!name || !name.trim()){ combineSet.clear(); return; }

  const cx = sources.reduce((s,n) => s + n.x, 0) / sources.length;
  const cy = Math.max(...sources.map(n => n.y)) + 130;

  const plusNode = { id: uid(), name: '+', type: 'combine', x: cx, y: cy };
  const newBook = { id: uid(), name: name.trim(), x: cx - 20, y: cy + 110, color: nextColor() };

  state.nodes.push(plusNode, newBook);
  sources.forEach(s => {
    state.edges.push({ id: uid(), from: s.id, to: plusNode.id, type: 'merge' });
  });
  state.edges.push({ id: uid(), from: plusNode.id, to: newBook.id, type: 'merge' });

  combineSet.clear();
  saveState();
  render();
}

  render();

  const node = state.nodes.find(n => n.id === id);

  const updated = prompt('Edit book name (Arabic on line 1, transliteration on line 2):', node.name);

function isValidCssColor(str){
  const opt = new Option();
  opt.style.color = '';
  opt.style.color = str;
  return opt.style.color !== '';
}

function promptColorText(id, ev){
  if(!isAdmin) return;
  ev.stopPropagation();
  const node = state.nodes.find(n => n.id === id);
  if(!node) return;
  const input = prompt('Type a color — hex code (e.g. #2f6f4f) or a CSS color name (e.g. teal):', node.color || '#8a7355');
  if(input === null) return;
  const trimmed = input.trim();
  if(!trimmed) return;
  if(!isValidCssColor(trimmed)){
    alert('"' + trimmed + '" doesn\'t look like a valid color. Try a hex code like #2f6f4f or a name like teal.');
    return;
  }
  node.color = trimmed;
  saveState();
  render();
}

function onNodeClick(id, ev){
  if(dragInfo && dragInfo.moved) return;

  if(combineMode){
    if(!isAdmin) return;
    if(combineSet.has(id)) combineSet.delete(id);
    else combineSet.add(id);
    render();
    return;
  }

  if(connectMode){
    if(!isAdmin) return;
    if(selected === null){
      selected = id;
      render();
      return;
    }
    if(selected === id){
      selected = null;
      render();
      return;
    }
    pendingPair = { from: selected, to: id };
    showMenu(ev.clientX, ev.clientY);
    return;
  }

  const node = state.nodes.find(n => n.id === id);
  if(!node || node.type === 'combine') return;

  if(viewedNode === id){
    closeNotesPopup();
  } else {
    openNotesPopup(id);
  }
}

let searchActiveIndex = -1;
const COMBINING_DIACRITICS_RE = new RegExp(
  '[' + String.fromCharCode(0x0300) + '-' + String.fromCharCode(0x036f) + ']', 'g'
);

function normalizeSearch(str){
  return str
    .normalize('NFD')
    .replace(COMBINING_DIACRITICS_RE, '') // strip macrons, dots below, etc.
    .replace(/[ʿʾ'’]/g, '') // strip ayn/hamza transliteration marks and apostrophes
    .toLowerCase();
}

function onSearchInput(){
  const q = normalizeSearch(document.getElementById('bookSearch').value.trim());
  const resultsEl = document.getElementById('searchResults');
  searchActiveIndex = -1;
  if(!q){ resultsEl.style.display = 'none'; resultsEl.innerHTML = ''; return; }

  const matches = state.nodes.filter(n => n.type !== 'combine' && normalizeSearch(n.name).includes(q)).slice(0, 20);

  resultsEl.innerHTML = '';
  if(matches.length === 0){
    const empty = document.createElement('div');
    empty.className = 'search-empty';
    empty.textContent = 'No books found.';
    resultsEl.appendChild(empty);
  } else {
    matches.forEach(n => {
      const lines = n.name.split('\n');
      const row = document.createElement('div');
      row.className = 'search-result';
      row.textContent = lines[0];
      if(lines[1]){
        const en = document.createElement('span');
        en.className = 'en';
        en.textContent = lines[1];
        row.appendChild(en);
      }
      row.onclick = () => selectSearchResult(n.id);
      resultsEl.appendChild(row);
    });
  }
  resultsEl.style.display = 'block';
}

function onSearchKeydown(ev){
  const resultsEl = document.getElementById('searchResults');
  const rows = Array.from(resultsEl.querySelectorAll('.search-result'));
  if(ev.key === 'Escape'){
    resultsEl.style.display = 'none';
    document.getElementById('bookSearch').blur();
    return;
  }
  if(ev.key === 'Enter'){
    ev.preventDefault();
    if(rows.length > 0){
      const idx = searchActiveIndex >= 0 ? searchActiveIndex : 0;
      rows[idx].click();
    }
    return;
  }
  if(ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){
    if(rows.length === 0) return;
    ev.preventDefault();
    searchActiveIndex += ev.key === 'ArrowDown' ? 1 : -1;
    if(searchActiveIndex < 0) searchActiveIndex = rows.length - 1;
    if(searchActiveIndex >= rows.length) searchActiveIndex = 0;
    rows.forEach((r,i) => r.classList.toggle('active', i === searchActiveIndex));
    rows[searchActiveIndex].scrollIntoView({ block: 'nearest' });
  }
}

function centerOnNode(id){
  const node = state.nodes.find(n => n.id === id);
  if(!node) return;
  const wrap = document.getElementById('canvas-wrap');
  const w = 220, h = 60; // approximate node footprint; good enough for centering
  const targetLeft = (node.x + w / 2) * zoom - wrap.clientWidth / 2;
  const targetTop = (node.y + h / 2) * zoom - wrap.clientHeight / 2;
  wrap.scrollTo({ left: Math.max(0, targetLeft), top: Math.max(0, targetTop) });
}

function getConnectionsFor(id){
  return state.edges.filter(e => e.from === id || e.to === id).map(e => {
    const otherId = e.from === id ? e.to : e.from;
    const other = state.nodes.find(n => n.id === otherId);
    const dir = e.from === id ? '→' : '←';
    return {
      edgeId: e.id,
      text: dir + ' ' + (other ? other.name.split('\n')[0] : '?') + ' (' + e.type + ')'
    };
  });
}

  dragInfo = {
    id,
    moved: false,
    startX: ev.clientX + wrap.scrollLeft,
    startY: ev.clientY + wrap.scrollTop,
    origX: node.x,
    origY: node.y
  };
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', endDrag);
}

function onDrag(ev){
  if(!dragInfo) return;
  const wrap = document.getElementById('canvas-wrap');
  const dx = ((ev.clientX + wrap.scrollLeft) - dragInfo.startX) / zoom;
  const dy = ((ev.clientY + wrap.scrollTop) - dragInfo.startY) / zoom;
  if(Math.abs(dx) > 3 || Math.abs(dy) > 3) dragInfo.moved = true;
  const node = state.nodes.find(n => n.id === dragInfo.id);
  node.x = Math.max(0, dragInfo.origX + dx);
  node.y = Math.max(0, dragInfo.origY + dy);
  render();
}

function endDrag(){
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', endDrag);
  if(dragInfo && dragInfo.moved) saveState();
  dragInfo = null;
}

}

function edgeColor(a, b){

function nodeBoxFor(n, elMap){

  const w = el ? el.offsetWidth : (n.type === 'combine' ? 22 : 160);
  const h = el ? el.offsetHeight : (n.type === 'combine' ? 22 : 40);
  return { left: n.x, right: n.x + w, top: n.y, bottom: n.y + h };
}

// Picks a y for an edge's horizontal jog that clears every book box it would otherwise cross.
// Prefers the empty gutter between century rows, then the literal midpoint, then a fine sweep.
function pickClearY(acx, bcx, ay, by, excludeIds, elMap){
  const lo = Math.min(ay, by), hi = Math.max(ay, by);
  const x1 = Math.min(acx, bcx), x2 = Math.max(acx, bcx);
  const literalMid = (ay + by) / 2;
  if(x2 - x1 < 1) return literalMid; // no horizontal segment to worry about

  const boundaries = ROW_BOUNDARIES
    .filter(y => y > lo + 2 && y < hi - 2)
    .sort((p, q) => Math.abs(p - literalMid) - Math.abs(q - literalMid));

  const candidates = [...boundaries, literalMid];
  for(let step = 15; step <= 200; step += 15){
    if(literalMid - step > lo) candidates.push(literalMid - step);
    if(literalMid + step < hi) candidates.push(literalMid + step);
  }

  const PAD = 6;
  for(const y of candidates){
    let hit = false;
    for(const n of state.nodes){
      if(excludeIds.has(n.id)) continue;
      const box = nodeBoxFor(n, elMap);
      if(y >= box.top - PAD && y <= box.bottom + PAD && x1 <= box.right + PAD && x2 >= box.left - PAD){
        hit = true;
        break;
      }
    }
    if(!hit) return y;
  }
  return literalMid;
}

// If id is a book formed by combining other books, returns the ids of those source
// books plus the ids of every edge in that merge chain (source -> "+" -> result).
function computeCombineHighlight(id){
  const sourceIds = new Set();
  const edgeIds = new Set();
  if(!id) return { sourceIds, edgeIds };
  state.edges.filter(e => e.type === 'merge' && e.to === id).forEach(e => {
    edgeIds.add(e.id);
    const plusNode = state.nodes.find(n => n.id === e.from);
    if(!plusNode || plusNode.type !== 'combine') return;
    state.edges.filter(e2 => e2.type === 'merge' && e2.to === plusNode.id).forEach(e2 => {
      sourceIds.add(e2.from);
      edgeIds.add(e2.id);
    });
  });
  return { sourceIds, edgeIds };
}

function render(){
  updateHint();
  updateModeButtons();

  const canvas = document.getElementById('canvas');
  document.querySelectorAll('.node').forEach(n => n.remove());

  const combineHL = computeCombineHighlight(viewedNode);

  const elMap = {};
  state.nodes.forEach(n => {
    const div = document.createElement('div');
    const isCombine = n.type === 'combine';
    let cls = 'node';
    if(isCombine) cls += ' combine';
    if(selected === n.id) cls += ' selected';
    if(combineSet.has(n.id)) cls += ' multiselect';
    if(n.manuscript) cls += ' manuscript';
    if(viewedNode === n.id) cls += ' viewed';
    if(combineHL.sourceIds.has(n.id)) cls += ' combine-source';
    div.className = cls;
    div.style.left = n.x + 'px';
    div.style.top = n.y + 'px';
    if(!isCombine && n.color && !n.manuscript){
      div.style.borderColor = n.color;
      div.style.borderWidth = '2px';
    }

    if(isCombine){
      div.textContent = '+';
    } else {
      const lines = n.name.split('\n');
      div.innerHTML = lines.map((l,i) => `<div style="${i===1 ? 'font-family:Cairo,sans-serif;font-weight:600;font-size:13px;font-style:italic;color:#6b5d4f;margin-top:3px;' : ''}">${l}</div>`).join('');
    }

    if(isAdmin) div.onmousedown = (ev) => { startDrag(n.id, ev); };
    div.onclick = (ev) => { onNodeClick(n.id, ev); };
    if(isAdmin) div.ondblclick = (ev) => { renameNode(n.id, ev); };
    div.title = isCombine ? '' : (isAdmin ? ((n.author ? n.author + ' — ' : '') + 'Double-click to rename') : (n.author || ''));

    if(!isCombine && isAdmin){
      const ms = document.createElement('div');
      ms.className = 'ms-toggle';
      ms.textContent = 'MS';
      ms.title = 'Mark as manuscript (مخطوط)';
      ms.onclick = (ev) => toggleManuscript(n.id, ev);
      div.appendChild(ms);

      const colorBtn = document.createElement('div');
      colorBtn.className = 'color-toggle';
      colorBtn.style.background = n.color || '#8a7355';
      colorBtn.title = 'Choose a color for this book';
      colorBtn.onclick = (ev) => openColorPicker(n.id, ev);
      div.appendChild(colorBtn);

      const colorTextBtn = document.createElement('div');
      colorTextBtn.className = 'color-text-toggle';
      colorTextBtn.textContent = '#';
      colorTextBtn.title = 'Type a color (hex code or name)';
      colorTextBtn.onclick = (ev) => promptColorText(n.id, ev);
      div.appendChild(colorTextBtn);

      const del = document.createElement('div');
      del.className = 'del';
      del.textContent = '×';
      del.onclick = (ev) => deleteNode(n.id, ev);
      div.appendChild(del);
    }
    canvas.appendChild(div);
    elMap[n.id] = div;
  });

  const svg = document.getElementById('lines');
  svg.innerHTML = '';

  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  svg.appendChild(defs);

  function subdivideElbow(p1, p2, p3, p4, segsPerLeg){
    const pts = [p1];
    const legs = [[p1,p2],[p2,p3],[p3,p4]];
    legs.forEach(([from,to]) => {
      for(let i=1;i<=segsPerLeg;i++){
        const t = i/segsPerLeg;
        pts.push([ from[0] + (to[0]-from[0])*t, from[1] + (to[1]-from[1])*t ]);
      }
    });
    return pts;
  }

  state.edges.forEach(e => {
    const a = state.nodes.find(n => n.id === e.from);
    const b = state.nodes.find(n => n.id === e.to);
    if(!a || !b) return;
    const aEl = elMap[a.id], bEl = elMap[b.id];
    const aw = aEl ? aEl.offsetWidth : 120, ah = aEl ? aEl.offsetHeight : 40;
    const bw = bEl ? bEl.offsetWidth : 120, bh = bEl ? bEl.offsetHeight : 40;

    const acx = a.x + aw/2, bcx = b.x + bw/2;
    let ay, by;
    if(b.y >= a.y){
      ay = a.y + ah;
      by = b.y;
    } else {
      ay = a.y;
      by = b.y + bh;
    }
    const ymid = pickClearY(acx, bcx, ay, by, new Set([a.id, b.id]), elMap);
    const color = edgeColor(a, b);
    const style = edgeStyle(e.type);

    const isHL = !!viewedNode && (e.from === viewedNode || e.to === viewedNode || combineHL.edgeIds.has(e.id));
    const dimmed = !!viewedNode && !isHL;
    const widthMul = isHL ? 1.7 : 1;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('opacity', dimmed ? '0.15' : '1');
    if(isHL) path.style.filter = 'drop-shadow(0 0 3px rgba(122,46,46,0.6))';

    if(e.type === 'commentary'){
      const p1 = [acx, ay], p2 = [acx, ymid], p3 = [bcx, ymid], p4 = [bcx, by];
      const pts = subdivideElbow(p1, p2, p3, p4, 5);
      const d = pts.map((p,i) => (i===0 ? 'M' : 'L') + ' ' + p[0] + ' ' + p[1]).join(' ');
      path.setAttribute('d', d);
      path.setAttribute('stroke-width', 1.8 * widthMul);

      const markerId = 'arrow-' + e.id;
      const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
      marker.setAttribute('id', markerId);
      marker.setAttribute('viewBox', '0 0 10 10');
      marker.setAttribute('refX', '5');
      marker.setAttribute('refY', '5');
      marker.setAttribute('markerWidth', '6');
      marker.setAttribute('markerHeight', '6');
      marker.setAttribute('orient', 'auto');
      const arrowShape = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      arrowShape.setAttribute('d', 'M 0 0 L 10 5 L 0 10 z');
      arrowShape.setAttribute('fill', color);
      marker.appendChild(arrowShape);
      defs.appendChild(marker);

      path.setAttribute('marker-mid', `url(#${markerId})`);
      path.setAttribute('marker-end', `url(#${markerId})`);
    } else if(e.type === 'merge'){
      const p1 = [acx, ay], p2 = [acx, ymid], p3 = [bcx, ymid], p4 = [bcx, by];
      const pts = subdivideElbow(p1, p2, p3, p4, 14);
      const d = pts.map((p,i) => (i===0 ? 'M' : 'L') + ' ' + p[0] + ' ' + p[1]).join(' ');
      path.setAttribute('d', d);
      path.setAttribute('stroke-width', 1.2 * widthMul);

      const markerId = 'star-' + e.id;
      const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
      marker.setAttribute('id', markerId);
      marker.setAttribute('viewBox', '0 0 10 10');
      marker.setAttribute('refX', '5');
      marker.setAttribute('refY', '5');
      marker.setAttribute('markerWidth', '5.5');
      marker.setAttribute('markerHeight', '5.5');
      marker.setAttribute('orient', '0');
      const starShape = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      starShape.setAttribute('d', 'M 5,0.5 L 6.06,3.54 L 9.28,3.61 L 6.71,5.56 L 7.65,8.64 L 5,6.8 L 2.36,8.64 L 3.29,5.56 L 0.72,3.61 L 3.94,3.54 Z');
      starShape.setAttribute('fill', color);
      marker.appendChild(starShape);
      defs.appendChild(marker);

      path.setAttribute('marker-mid', `url(#${markerId})`);
      path.setAttribute('marker-end', `url(#${markerId})`);
    } else {
      const d = `M ${acx} ${ay} L ${acx} ${ymid} L ${bcx} ${ymid} L ${bcx} ${by}`;
      path.setAttribute('d', d);
      path.setAttribute('stroke-width', style.width * widthMul);
      if(style.dash !== 'none') path.setAttribute('stroke-dasharray', style.dash);
    }

    if(isAdmin){
      path.style.pointerEvents = 'stroke';
      path.style.cursor = 'pointer';
      path.onclick = () => {
        if(confirm('Remove this connection?')){
          state.edges = state.edges.filter(x => x.id !== e.id);
          saveState();
          render();
        }
      };
    } else {
      path.style.pointerEvents = 'none';
    }
    svg.appendChild(path);
  });

  renderPopups();
}

document.addEventListener('click', (ev) => {
  if(!ev.target.closest('#bookSearch') && !ev.target.closest('.search-results')){
    const resultsEl = document.getElementById('searchResults');
    if(resultsEl) resultsEl.style.display = 'none';
  }
  if(ev.target.closest('.node') || ev.target.closest('#menu') || ev.target.closest('#toolbar') || ev.target.closest('#notesPopups') || ev.target.closest('.export-overlay')) return;
  hideMenu();
  closeNotesPopup();
}, true);

document.getElementById('canvas-wrap').addEventListener('wheel', (ev) => {
  if(!(ev.ctrlKey || ev.metaKey)) return;
  ev.preventDefault();
  if(ev.deltaY < 0) zoomIn(); else zoomOut();
}, { passive: false });

initAdminMode();
buildTimeline();
loadState().then(() => { applyZoom(); loadPublishedNotes(); });
</script>

</body>
</html>
